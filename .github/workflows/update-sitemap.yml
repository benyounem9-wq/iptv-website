name: Update sitemap

# Regenerates sitemap.xml from the real files on every push to main that
# touches content, so it can never go stale or reference a deleted page
# again. See scripts/generate-sitemap.mjs for how URLs and lastmod dates
# are derived.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "blog/**"
      - "scripts/generate-sitemap.mjs"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so per-file lastmod dates are real, not guessed

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate sitemap.xml
        run: node scripts/generate-sitemap.mjs

      - name: Commit sitemap.xml if it changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "sitemap.xml unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: regenerate sitemap.xml [skip ci]"
          git push
